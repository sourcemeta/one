events {}

http {
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/keycloak.crt;
    ssl_certificate_key /etc/nginx/tls/keycloak.key;

    # Two providers that differ in exactly one place: the scheme of the token
    # endpoint they advertise. Both are reached over the same certificate under
    # the same name, so an instance that completes a login against the first
    # would be posting its client secret, the authorization code and the PKCE
    # verifier to a host named by the document, in the clear. The pair exists so
    # that a refusal can be attributed to the scheme rather than to anything
    # else about the document
    location = /realms/cleartext/.well-known/openid-configuration {
      default_type application/json;
      return 200 '{"issuer":"https://keycloak:8443/realms/cleartext","authorization_endpoint":"https://keycloak:8443/realms/cleartext/protocol/openid-connect/auth","token_endpoint":"http://keycloak:8443/realms/cleartext/protocol/openid-connect/token","jwks_uri":"https://keycloak:8443/realms/cleartext/protocol/openid-connect/certs","response_types_supported":["code"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}';
    }

    location = /realms/encrypted/.well-known/openid-configuration {
      default_type application/json;
      return 200 '{"issuer":"https://keycloak:8443/realms/encrypted","authorization_endpoint":"https://keycloak:8443/realms/encrypted/protocol/openid-connect/auth","token_endpoint":"https://keycloak:8443/realms/encrypted/protocol/openid-connect/token","jwks_uri":"https://keycloak:8443/realms/encrypted/protocol/openid-connect/certs","response_types_supported":["code"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}';
    }

    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
