services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=https://keycloak:8443
      - KC_PROXY_HEADERS=xforwarded
    ports:
      - "8443:8443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 2s
      timeout: 5s
      retries: 60

  # TLS termination sharing the identity provider's network identity, so the
  # provider answers over https under the very name its issuer advertises
  keycloak-nginx:
    image: nginx:1.27-alpine
    network_mode: service:keycloak
    volumes:
      - ../keycloak/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../keycloak/tls:/etc/nginx/tls:ro
    depends_on:
      keycloak:
        condition: service_started

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tls: ../keycloak/tls
      args:
        SOURCEMETA_ONE_SANDBOX_EDITION: ${EDITION}
    environment:
      - SOURCEMETA_ONE_PORT=8001
    env_file:
      - environment
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-nginx:
        condition: service_started
    ports:
      - "${PORT}:8001"
