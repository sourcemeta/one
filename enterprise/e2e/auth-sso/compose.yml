services:
  keycloak-backend:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=https://keycloak:8443
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 2s
      timeout: 5s
      retries: 60

  # TLS termination in front of the identity provider, carrying the name the
  # issuer advertises, so every client verifies a real certificate chain
  keycloak:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    ports:
      - "8443:8443"
    depends_on:
      keycloak-backend:
        condition: service_healthy

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCEMETA_ONE_SANDBOX_EDITION: ${EDITION}
    environment:
      - SOURCEMETA_ONE_PORT=8001
    env_file:
      - environment
    depends_on:
      keycloak:
        condition: service_started
      keycloak-backend:
        condition: service_healthy
    ports:
      - "${PORT}:8001"
