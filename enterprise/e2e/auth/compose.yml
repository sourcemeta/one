services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=https://keycloak:8443
      - KC_PROXY_HEADERS=xforwarded
    ports:
      - "8443:8443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 2s
      timeout: 5s
      retries: 60

  # TLS termination sharing the identity provider's network identity, so the
  # provider answers over https under the very name its issuer advertises
  keycloak-nginx:
    image: nginx:1.27-alpine
    network_mode: service:keycloak
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      keycloak:
        condition: service_started

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCEMETA_ONE_SANDBOX_EDITION: ${EDITION}
    environment:
      - SOURCEMETA_ONE_PORT=8001
    env_file:
      - environment
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-nginx:
        condition: service_started
    ports:
      - "${PORT}:8001"

  # A real scraper rather than a reader of our own making, so what this
  # instance publishes is judged by the software it claims to speak to. It
  # scrapes a gated path, so it also proves a policy admits a scraper holding
  # the right credential and nothing else
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9099:9090"
    depends_on:
      sandbox:
        condition: service_started
