services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=https://keycloak:8443
      - KC_PROXY_HEADERS=xforwarded
    ports:
      - "8443:8443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 2s
      timeout: 5s
      retries: 60

  # TLS termination sharing the identity provider's network identity, so the
  # provider answers over https under the very name its issuer advertises
  keycloak-nginx:
    image: nginx:1.27-alpine
    network_mode: service:keycloak
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      keycloak:
        condition: service_started

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCEMETA_ONE_SANDBOX_EDITION: ${EDITION}
    environment:
      - SOURCEMETA_ONE_PORT=8001
    env_file:
      - environment
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-nginx:
        condition: service_started
    ports:
      - "${PORT}:8000"

  # TLS termination sharing the registry's network identity, so the instance
  # answers over https under the very name its resource identifier advertises.
  # RFC 9728 admits no other scheme, so without this there is nothing to publish
  registry-nginx:
    image: nginx:1.27-alpine
    network_mode: service:sandbox
    volumes:
      - ./registry-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    # Sharing the registry's namespace means the listener shows up in the same
    # table, so readiness is the TLS port being bound rather than the container
    # being up, which is all `depends_on` would otherwise wait for
    healthcheck:
      test: [ "CMD-SHELL", "grep -qE ':1F40\\s+[0-9A-F:]+\\s+0A\\s' /proc/net/tcp" ]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      sandbox:
        condition: service_healthy
