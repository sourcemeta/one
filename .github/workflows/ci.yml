name: Sourcemeta One CI

on:
  schedule:
    # Once per day, Monday to Friday
    - cron: '0 19 * * 1-5'
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: one-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        edition:
          - name: community
            options: ENTERPRISE=OFF
          - name: enterprise
            options: ENTERPRISE=ON

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: make check ${{ matrix.edition.options }}

      # A runner is thrown away after the job, so the compiler cache the image
      # build keeps would start empty every time. It is carried across runs
      # here instead, which is what stops the same objects being compiled again
      # on every push.
      #
      # The sandbox images are built from this one by Compose, which reads the
      # daemon's image store. A builder of this kind keeps a store of its own,
      # so it is created without becoming the current one, and named where it
      # is wanted instead
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false

      - name: Cache the compiler cache
        uses: actions/cache@v4
        id: ccache
        with:
          path: ccache-mount
          key: ccache-${{ matrix.edition.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.edition.name }}-

      # A cache mount lives inside the builder rather than in a layer, so
      # neither the image cache nor the checkout carries it. This puts the
      # restored one back before the build and takes the new one out after
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache-mount": "/ccache"
            }
          # A build that succeeded produced a cache worth keeping, whatever a
          # later step goes on to do with it
          save-always: true

      # The builder above writes nowhere the later steps can see, so the image
      # is loaded into the store they read from
      - run: make docker-build PRESET=Release PARALLEL=$(nproc) DOCKERFILE_TEST_REPEAT=5 DOCKER="docker buildx" DOCKER_BUILD_FLAGS="--load --builder ${{ steps.buildx.outputs.name }}" ${{ matrix.edition.options }}

      - name: SBOM (Enterprise)
        run: |
          node ./enterprise/scripts/sbom.js one /tmp/sbom.spdx.json
          cat /tmp/sbom.spdx.json
          npx --yes @sourcemeta/jsonschema validate \
            vendor/spdx/schemas/spdx-schema.json /tmp/sbom.spdx.json --verbose
        if: matrix.edition.name == 'enterprise'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: E2E (empty)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/empty
          edition: ${{ matrix.edition.name }}
      - name: E2E (headless)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/headless
          edition: ${{ matrix.edition.name }}
      - name: E2E (html)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/html
          edition: ${{ matrix.edition.name }}
      - name: E2E (meta)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/meta
          edition: ${{ matrix.edition.name }}
      - name: E2E (no-api)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/no-api
          edition: ${{ matrix.edition.name }}
      - name: E2E (chaos)
        uses: ./.github/actions/e2e
        with:
          path: test/e2e/chaos
          edition: ${{ matrix.edition.name }}

      - name: E2E (enterprise/empty)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/empty
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/html)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/html
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/public)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/public
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/auth-keys)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/auth-keys
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/auth)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/auth
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/auth-closed)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/auth-closed
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'
      - name: E2E (enterprise/auth-sso)
        uses: ./.github/actions/e2e
        with:
          path: enterprise/e2e/auth-sso
          edition: ${{ matrix.edition.name }}
        if: matrix.edition.name == 'enterprise'

      - name: Benchmark
        run: |
          make docker-benchmark PRESET=Release ${{ matrix.edition.options }}
          docker run --rm one-benchmark > benchmark.json
      - uses: benchmark-action/github-action-benchmark@v1
        if: github.event.pull_request.head.repo.fork == false
        with:
          name: Benchmark Index (${{ matrix.edition.name }})
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name != 'pull_request' }}
          benchmark-data-dir-path: benchmark/${{ matrix.edition.name }}/index
          alert-threshold: '5%'
          comment-always: true
          fail-on-alert: false

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install mkdocs-material
      - run: mkdocs build --config-file mkdocs.yml --strict --site-dir ./build/website
